# 安装包只包含生产运行所需的编译产物，避免把源码、测试和本地配置带入发布包。
appId: com.dianxiaoqi.qianchuan
productName: 电小奇·千川超级商品卡
asar: true

# DEV 分支就是正式更新渠道。electron-builder 会据此生成 app-update.yml 和 latest*.yml，
# GitHub Actions 再把安装包与更新元数据上传到同一个普通 GitHub Release。
publish:
  provider: github
  owner: yaotutu
  repo: qianchuan-electron
  releaseType: release

directories:
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# 文件名使用 ASCII，降低不同系统、下载工具和发布 API 对中文路径兼容不一致的风险。
artifactName: qianchuan-electron-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  # AppImage 内部可执行文件名必须仅使用安全的 ASCII 字符；产品展示名称仍保留中文。
  executableName: qianchuan-electron
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
